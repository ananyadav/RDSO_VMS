# CCTV — local Windows Nginx (dev direct-media entry point)
#
# Open the app at http://127.0.0.1:8080/ (not Vite :3000 alone).
# Verified upstreams (local):
#   Vite frontend   127.0.0.1:3000
#   Python backend  127.0.0.1:10000
#   go2rtc worker 1 127.0.0.1:1984
#   go2rtc worker 2 127.0.0.1:1985
#   go2rtc worker 3 127.0.0.1:1986
#   go2rtc worker 4 127.0.0.1:1987
#   go2rtc worker 5 127.0.0.1:1988
#
# Start: deploy/start-local-nginx.ps1
# Reference production routes: deploy/nginx-cctv-direct-media.conf

upstream cctv_backend {
    server 127.0.0.1:10000;
    keepalive 32;
}

upstream cctv_vite {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    set $cctv_orig "";

    # --- App API (Python) ---
    location /api/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Player JS assets via Python → go2rtc (auth on non-asset paths)
    location /go2rtc/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    # Literal auth_request URI (no $vars, no @named). Windows nginx 1.26:
    #   - does not expand variables in auth_request
    #   - treats @named as a static file under html/
    # Parent $request_uri is captured first so media-auth still sees src=.
    location = /internal/go2rtc-media-auth {
        internal;
        proxy_pass http://127.0.0.1:10000/api/go2rtc/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header X-Original-URI $cctv_orig;
        proxy_set_header Host 127.0.0.1:10000;
    }

    # Direct media. Literal proxy_pass (not regex + $variable) so Windows
    # nginx can complete the WebSocket 101 to go2rtc. ^~ stops w6+ catch-all below.
    location ^~ /media/w1/ {
        set $cctv_orig $request_uri;
        auth_request /internal/go2rtc-media-auth;
        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /media/w2/ {
        set $cctv_orig $request_uri;
        auth_request /internal/go2rtc-media-auth;
        proxy_pass http://127.0.0.1:1985/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /media/w3/ {
        set $cctv_orig $request_uri;
        auth_request /internal/go2rtc-media-auth;
        proxy_pass http://127.0.0.1:1986/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /media/w4/ {
        set $cctv_orig $request_uri;
        auth_request /internal/go2rtc-media-auth;
        proxy_pass http://127.0.0.1:1987/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ^~ /media/w5/ {
        set $cctv_orig $request_uri;
        auth_request /internal/go2rtc-media-auth;
        proxy_pass http://127.0.0.1:1988/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # w6+ must not fall through to Vite or another worker.
    location ~ ^/media/w[0-9]+/ {
        return 404 "Unsupported go2rtc worker";
    }

    # SPA + Vite dev server (HMR WebSocket)
    location / {
        proxy_pass http://cctv_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }
}
