# CCTV — local Windows Nginx (dev direct-media entry point)
#
# Open the app at http://127.0.0.1:8080/ (not Vite :3000 alone).
# Verified upstreams (local):
#   Vite frontend   127.0.0.1:3000
#   Python backend  127.0.0.1:10000
#   go2rtc worker 1 127.0.0.1:1984
#   go2rtc worker 2 127.0.0.1:1985
#   go2rtc worker 3 127.0.0.1:1986
#
# Start: deploy/start-local-nginx.ps1
# Reference production routes: deploy/nginx-cctv-direct-media.conf

upstream cctv_backend {
    server 127.0.0.1:10000;
    keepalive 32;
}

upstream cctv_vite {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $go2rtc_worker_id $go2rtc_upstream {
    default http://127.0.0.1:1984;
    1       http://127.0.0.1:1984;
    2       http://127.0.0.1:1985;
    3       http://127.0.0.1:1986;
}

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # --- App API (Python) ---
    location /api/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Player JS assets via Python → go2rtc (auth on non-asset paths)
    location /go2rtc/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    # Internal auth_request — session cookie + stream ACL (no video bytes).
    location = /internal/go2rtc-media-auth {
        internal;
        proxy_pass http://cctv_backend/api/go2rtc/media-auth$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Direct media: /media/w1/... → worker 1, etc.
    location ~ ^/media/w([0-9]+)/(.*)$ {
        set $go2rtc_worker_id $1;
        set $go2rtc_path $2;

        auth_request /internal/go2rtc-media-auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass $go2rtc_upstream/$go2rtc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA + Vite dev server (HMR WebSocket)
    location / {
        proxy_pass http://cctv_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }
}
