# CCTV — production HTTPS/WSS sample (RDSO 18.6.22.11)
#
# Architecture:
#   Browser ──HTTPS/WSS──▶ Nginx (:443) ──HTTP/WS──▶ localhost:10000 (aiohttp)
#                                              └──▶ localhost:1984+ (go2rtc workers)
#
# TLS terminates at Nginx only. Do NOT expose backend or camera RTSP credentials.
# Minimum 128-bit symmetric encryption via modern TLS 1.2 / 1.3 cipher suites.
#
# Replace CERT_PATH / KEY_PATH. Keep X-Forwarded-Proto so the app can set
# Secure session cookies and honor HTTPS_ENFORCE=1.
#
# Local Windows HTTP-only entry remains deploy/nginx-local-windows.conf (:8080).

upstream cctv_backend {
    server 127.0.0.1:10000;
    keepalive 32;
}

upstream cctv_vite {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Optional: redirect plain HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_VMS_HOSTNAME;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_VMS_HOSTNAME;

    ssl_certificate     /etc/ssl/certs/vms-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/vms-privkey.pem;

    # Prefer TLS 1.2 / 1.3; AEAD ciphers ≥128-bit (AES-GCM / ChaCha20)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # --- App API ---
    location /api/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
    }

    location /go2rtc/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    # Direct media to go2rtc workers (WSS from browser → WS on localhost)
    location ^~ /media/w1/ {
        proxy_pass http://127.0.0.1:1984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location ^~ /media/w2/ {
        proxy_pass http://127.0.0.1:1985/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    location ^~ /media/w3/ {
        proxy_pass http://127.0.0.1:1986/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # SPA / Vite (or built static assets)
    location / {
        proxy_pass http://cctv_vite;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
    }
}
