# CCTV / NVR — Nginx direct media to go2rtc workers
#
# REQUIRED Live View path (Python live-video WS proxy was removed):
#   Browser → Nginx /media/w{N}/api/ws → go2rtc worker N (127.0.0.1:1983+N)
#
# Python aiohttp stays on :10000 for /api/* (auth, metadata, PTZ, control).
# Video binary packets must NOT pass through Python.
#
# Prerequisites:
#   1. Include this file from your site config (adjust server_name / SSL)
#   2. Workers listening on 1984 / 1985 / 1986 (see go2rtc/README.md)
#   3. For local Live View, open the app via this Nginx entry (not Vite :3000 alone)

upstream cctv_backend {
    server 127.0.0.1:10000;
    keepalive 32;
}

# Worker API ports: w1=1984, w2=1985, w3=1986
map $go2rtc_worker_id $go2rtc_upstream {
    default http://127.0.0.1:1984;
    1       http://127.0.0.1:1984;
    2       http://127.0.0.1:1985;
    3       http://127.0.0.1:1986;
}

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # --- App API + static (Python) ---
    location /api/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    # Player JS assets still served via Python → go2rtc (auth on non-asset paths)
    location /go2rtc/ {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    # Internal auth_request — validates session cookie + stream ACL (no video).
    location = /internal/go2rtc-media-auth {
        internal;
        proxy_pass http://cctv_backend/api/go2rtc/media-auth$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # Direct media: /media/w1/... → worker 1, etc.
    location ~ ^/media/w([0-9]+)/(.*)$ {
        set $go2rtc_worker_id $1;
        set $go2rtc_path $2;

        auth_request /internal/go2rtc-media-auth;
        auth_request_set $auth_status $upstream_status;

        proxy_pass $go2rtc_upstream/$go2rtc_path$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # SPA / static from backend (or replace with root /var/www/cctv)
    location / {
        proxy_pass http://cctv_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
}
